name: Test GoldR 24K Encryption

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pycryptodome

      - name: Run GoldR 24K diagnostic
        run: |
          python scripts/test_live24k.py

      - name: Upload diagnostic files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: goldr-live24k-diagnostic
          path: |
            goldr_live24k_response.json
            goldr_decrypted_candidate.json
            goldr_decrypted_candidate.txt
