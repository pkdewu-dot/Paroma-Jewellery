name: Update Gold and Silver Market Prices

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-market:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Fetch and validate prices
        run: |
          python - <<'PY'
          import json
          import urllib.request
          from pathlib import Path
          from datetime import datetime, timezone

          def fetch(url):
              req = urllib.request.Request(
                  url, headers={"User-Agent": "ParomaJewellery/1.0"}
              )
              with urllib.request.urlopen(req, timeout=30) as response:
                  return json.loads(response.read().decode("utf-8"))

          gold_data = fetch("https://gold-price.bd/api/gold/latest.json")
          silver_data = fetch("https://gold-price.bd/api/silver/latest.json")

          def prices(data):
              data = data.get("latest", data)
              result = {}
              for key in ("k22", "k21", "k18"):
                  value = data.get(key)
                  if isinstance(value, dict):
                      value = value.get("price")
                  if isinstance(value, bool) or not isinstance(value, (int, float)) or value <= 0:
                      raise ValueError(f"Invalid price: {key}")
                  result[key] = value
              return result

          result = {
              "gold": prices(gold_data),
              "silver": prices(silver_data),
              "lastUpdate": datetime.now(timezone.utc).strftime("%Y-%m-%d")
          }

          path = Path("market.json")
          old = json.loads(path.read_text(encoding="utf-8"))
          if old != result:
              path.write_text(
                  json.dumps(result, ensure_ascii=False, indent=2) + "\n",
                  encoding="utf-8"
              )
              print("Prices saved.")
          else:
              print("No changes.")
          PY

      - name: Commit updated prices
        run: |
          if git diff --quiet -- market.json; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add market.json
          git commit -m "Update gold and silver market prices"
          git push
