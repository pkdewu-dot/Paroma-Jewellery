name: Build Universal APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.x'

      - name: Recreate Flutter Project Structure
        run: |
          mkdir temp_app
          cd temp_app
          flutter create poroma_jewellers --org com.pk.poromajewellers
          cp -r poroma_jewellers/* ../
          cd ..
          rm -rf temp_app

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PoromaJewellers-APK
          path: build/app/outputs/flutter-apk/app-release.apk

